name: First CI

on:
  push:
    branches: [ "main" ]

jobs:
  hello:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/checkout@v1
      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
          with:
              version: 0.13.4
      - name: Terraform apply
        run: |
          terraform init
          terraform plan
