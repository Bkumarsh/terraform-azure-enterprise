name: GitHub Actions Learning

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write


jobs:

  # =====================================
  # JOB 1
  # =====================================

  build:
    runs-on: ubuntu-latest

    environment:
      name: "production"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

      - name: Step 1
        run: echo "Hello from GitHub Actions"

      - name: Step 2
        run: echo "I am learning CI/CD"

      - name: Step 3
        run: |
          echo "This is my first pipeline"
          echo "Runner is working successfully"

      - name: Create File
        run: |
          echo "This is file 1" > file1.txt
          echo "This is file 2" > file2.txt
          echo "This is file 3" > file3.txt

          echo "Job 1 files:"
          ls -la

      - name: Upload Job 1 File
        uses: actions/upload-artifact@v4
        with:
          name: my-files
          path: |
            file1.txt
            file2.txt
            file3.txt
          retention-days: 1


  # =====================================
  # JOB 2
  # =====================================

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download Job 1 File
        uses: actions/download-artifact@v4
        with:
          name: my-files

      - name: Verify files
        run: |
          echo "Downloaded files:"
          ls -la

          echo "File 1:"
          cat file1.txt

          echo "File 2:"
          cat file2.txt

          echo "File 3:"
          cat file3.txt